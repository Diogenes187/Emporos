<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Emporos</title>
<style>
  :root{
    --bg:#06070c; --panel:#0d1019; --panel2:#11151f; --line:#222c45;
    --ink:#e8ecf5; --dim:#93a0c2; --accent:#49c0b8; --gold:#ffd351;
    --water:#3f80df; --amber:#f6c343; --red:#ef4146;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Helvetica,Arial,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;letter-spacing:1px;color:var(--ink)}
  header .spacer{flex:1}
  select,button,input,textarea{background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.goldbtn{border-color:var(--gold);color:var(--gold)}
  main{display:grid;grid-template-columns:1fr 320px;
       grid-template-rows:1fr 300px;
       height:calc(100vh - 53px);gap:1px;background:var(--line)}
  .boardwrap{background:var(--bg);overflow:auto;position:relative;padding:12px}
  aside{background:var(--panel);overflow:auto;padding:10px}
  .tabs{display:flex;gap:4px;margin-bottom:8px}
  .tabs button{flex:1;padding:5px}
  .tabs button.active{border-color:var(--accent);color:var(--accent)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
        padding:8px 10px;margin-bottom:7px}
  .card .nm{font-weight:600}
  .card .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .card form{margin:4px 0 0}
  .feed{grid-column:1 / span 2;background:var(--panel);display:flex;
        flex-direction:column;border-top:1px solid var(--line)}
  .log{flex:1;overflow:auto;padding:10px 14px}
  .msg{margin-bottom:9px;line-height:1.45}
  .msg .who{color:var(--accent);font-weight:600;margin-right:6px}
  .msg.gm .who{color:var(--gold)}
  .msg.sys{color:var(--dim);font-style:italic}
  .msg.err{color:var(--red)}
  .msg .t{color:var(--dim);font-size:11px;margin-right:6px}
  .inputbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .inputbar input{flex:1;min-width:0}
  .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);
        border-radius:10px;padding:1px 7px}
  a.pill{text-decoration:none;color:var(--ink)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
         align-items:center;justify-content:center;z-index:50}
  .modalcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
             max-width:580px;width:92%;max-height:88vh;overflow:auto;padding:20px}
  .modalcard h3{margin:0 0 10px}
  .modalcard label{color:var(--dim);font-size:12px;display:block;margin-top:8px}
  .cgfeed{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
          padding:8px 10px;margin:8px 0;font-size:12px;color:var(--dim);max-height:160px;overflow:auto}
  .cgfeed div{margin:2px 0}
  .cgbtns button{margin:3px}
  .cgstep{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:var(--panel2)}
  .cgstep b{color:var(--accent)}
  .cgstep small{color:var(--dim);display:block;letter-spacing:1px;margin-bottom:4px}
  .board h2{font-size:13px;letter-spacing:1px;color:var(--dim);margin:14px 0 6px;text-transform:uppercase}
  .board .card{max-width:640px}
  .rowform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .upp{font-family:monospace;color:var(--gold);letter-spacing:2px}
  @media (max-width:820px){
    header{flex-wrap:wrap;gap:6px;padding:8px 10px}
    header .spacer{display:none}
    main{display:flex;flex-direction:column;height:auto}
    .boardwrap{min-height:270px}
    aside{max-height:38vh}
    .feed{height:52vh}
    .inputbar{position:sticky;bottom:0;background:var(--panel)}
    select,button,input,textarea{font-size:16px;padding:8px 10px}
    .pill{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>EMPOROS</h1>
  <select id="campaignSel" title="Campaign"></select>
  <button id="newBtn">New Campaign</button>
  <a class="pill" href="/classic/market" title="The Exchange">&#9878; Market</a>
  <a class="pill" href="/classic/battle" title="The Field Desk">&#9876; Battle</a>
  <span class="spacer"></span>
  <span id="mcpPill" class="pill" title="Desktop MCP referee connection"></span>
  <span id="userpill" class="pill" title="Signed in">&#9679; signed in</span>
  <button id="logoutBtn">Logout</button>
</header>

<main>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <aside>
    <div class="tabs">
      <button data-tab="crew" class="active">Crew</button>
      <button data-tab="ships">Ships</button>
      <button data-tab="systems">Systems</button>
      <button data-tab="journal">Journal</button>
    </div>
    <div id="panel"></div>
  </aside>
  <div class="feed">
    <div class="log" id="log"></div>
    <div class="inputbar">
      <input id="actionIn" placeholder="Tell the referee what you do&hellip;  (Enter to send)"/>
      <button id="sendBtn">Send</button>
    </div>
  </div>
</main>

<div id="cgModal" class="modal" style="display:none"><div class="modalcard"><div id="cgBody"></div></div></div>
<div id="genModal" class="modal" style="display:none"><div class="modalcard" id="genBody"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();

const S={campaigns:[],cid:null,full:null,shipClasses:[],tab:'crew',local:[],cgActor:null,cgLog:[],kept:{}};

function log(text,cls){S.local.push({t:new Date(),text,cls:cls||'sys'});renderLog();}
function renderLog(){
  const el=$('#log');let h='';
  const msgs=(S.full&&S.full.referee_messages)||[];
  for(const m of msgs){
    const gm=m.speaker_kind!=='player';
    const waiting=m.turn_status==='pending';
    h+=`<div class="msg${gm?' gm':''}${waiting?' sys':''}"><span class="who">${gm?'Referee':waiting?'You · awaiting connected MCP referee':'You'}</span>${esc(m.message_text)}</div>`;
  }
  for(const e of S.local){
    h+=`<div class="msg ${e.cls}"><span class="t">${e.t.toLocaleTimeString()}</span>${esc(e.text)}</div>`;
  }
  el.innerHTML=h||'<div class="msg sys">Feed is quiet. Actions and rule outcomes will appear here.</div>';
  el.scrollTop=el.scrollHeight;
}

async function api(path){
  const r=await fetch(path,{headers:{'Accept':'application/json'}});
  if(r.status===401){location.href='/login?next=/classic';throw new Error('unauthenticated');}
  if(!r.ok)throw new Error('GET '+path+' -> '+r.status);
  return r.json();
}

function postOk(r){return r.type==='opaqueredirect'||r.status===303||r.status===0||(r.status>=200&&r.status<400);}

async function post(path,fields,okMsg){
  const body=new URLSearchParams();
  for(const[k,v]of Object.entries(fields||{})){
    if(Array.isArray(v)){for(const item of v)body.append(k,item);}
    else if(v!==undefined&&v!==null)body.append(k,v);
  }
  if(!body.has('idempotency_key'))body.append('idempotency_key',uuid());
  return submit(path,{method:'POST',body,redirect:'manual'},okMsg);
}
async function postMultipart(path,formData,okMsg){
  if(!formData.has('idempotency_key'))formData.append('idempotency_key',uuid());
  return submit(path,{method:'POST',body:formData,redirect:'manual'},okMsg);
}
async function submit(path,opts,okMsg){
  let r;
  try{r=await fetch(path,opts);}catch(e){log('Network error: '+e.message,'err');return false;}
  if(r.status===401){location.href='/login?next=/classic';return false;}
  if(r.status===400||r.status===403||r.status===404||r.status===413||r.status===422||r.status===500){
    let detail='HTTP '+r.status;
    try{const j=await r.json();detail=typeof j.detail==='string'?j.detail:JSON.stringify(j.detail);}catch(e){}
    log('Rule check: '+detail,'err');
    if(S.cgActor)S.cgLog.push('✗ '+detail);
    return false;
  }
  if(postOk(r)){
    if(okMsg){log(okMsg,'sys');if(S.cgActor)S.cgLog.push('✓ '+okMsg);}
    await refresh();
    return true;
  }
  log('Unexpected response '+r.status,'err');return false;
}

async function refresh(){
  if(!S.cid){render();return;}
  S.full=await api('/api/campaigns/'+S.cid+'/full');
  render();
}

function render(){
  paintMcp(S.full&&S.full.mcp_referee);renderBoard();renderPanel();renderLog();
  if(S.cgActor)renderChargen();
}
function paintMcp(mcp){
  const p=$('#mcpPill'),state=(mcp&&mcp.status)||'offline';
  const labels={connected:'MCP Referee: Connected',waiting:'MCP Referee: Waiting',offline:'MCP Referee: Offline'};
  p.textContent=labels[state];
  p.style.color=state==='connected'?'#4ade80':state==='waiting'?'var(--gold)':'var(--red)';
  p.title=state==='offline'?'Open or reconnect your desktop MCP client.':state==='waiting'?`${mcp.pending_turns||1} player action(s) awaiting the desktop referee.`:`${mcp.client_name||'Desktop MCP client'} is connected.`;
}

/* ---------- header / campaigns ---------- */
async function loadCampaigns(){
  S.campaigns=await api('/api/campaigns');
  const sel=$('#campaignSel');
  sel.innerHTML=S.campaigns.map(c=>`<option value="${c.public_id}">${esc(c.name)} · day ${c.day_number}</option>`).join('')||'<option value="">— no campaigns —</option>';
  const want=new URLSearchParams(location.search).get('campaign');
  if(want&&S.campaigns.some(c=>c.public_id===want))S.cid=want;
  else S.cid=S.campaigns.length?S.campaigns[0].public_id:null;
  if(S.cid)sel.value=S.cid;
}
$('#campaignSel').addEventListener('change',async e=>{
  S.cid=e.target.value||null;S.full=null;S.local=[];
  history.replaceState(null,'','/classic'+(S.cid?'?campaign='+S.cid:''));
  await refresh();
});
$('#logoutBtn').onclick=async()=>{await fetch('/logout',{method:'POST',redirect:'manual'});location.href='/login';};
$('#newBtn').onclick=()=>{
  openGen(`<h3>New Campaign</h3>
    <label>Name <input id="ncName" maxlength="120"></label>
    <label>Play mode <select id="ncMode">
      <option value="player_directed">player_directed</option>
      <option value="human_refereed">human_refereed</option>
      <option value="ai_assisted">ai_assisted</option>
      <option value="ai_refereed" selected>ai_refereed</option>
    </select></label>
    <label>Starting setting <select id="ncSetting">
      <option value="ledger_reach" selected>Ledger Reach — Emporos default</option>
      <option value="generate_original">Generate an original sector</option>
      <option value="import_own">Import my own sector after creation</option>
      <option value="uncharted">Begin uncharted / without a sector</option>
    </select></label>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeGen()">Cancel</button>
      <button id="ncGo">Create</button></div>`);
  $('#ncGo').onclick=async()=>{
    const name=$('#ncName').value.trim();if(!name)return;
    const ok=await post('/campaigns',{name,play_mode:$('#ncMode').value,setting_choice:$('#ncSetting').value},'Campaign "'+name+'" created.');
    if(ok){closeGen();await loadCampaigns();
      const mine=S.campaigns.find(c=>c.name===name);if(mine){S.cid=mine.public_id;$('#campaignSel').value=S.cid;}
      await refresh();}
  };
};
function openGen(html){$('#genBody').innerHTML=html;$('#genModal').style.display='flex';}
function closeGen(){$('#genModal').style.display='none';}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');S.tab=b.dataset.tab;renderPanel();
});

const CHAR_ORDER=['characteristic.strength','characteristic.dexterity','characteristic.endurance','characteristic.intelligence','characteristic.education','characteristic.social-standing'];
function uppOf(a){
  const by={};for(const c of a.characteristics||[])by[c.code]=c.current;
  return CHAR_ORDER.map(c=>{const v=by[c];return v==null?'-':v.toString(16).toUpperCase();}).join('');
}
function cashOf(a){
  let t=0;for(const acc of a.accounts||[])t+=acc.balance_minor||0;return t;
}

function renderPanel(){
  const el=$('#panel'),f=S.full;
  if(!f){el.innerHTML='<div class="card"><div class="sub">No campaign selected.</div></div>';return;}
  if(S.tab==='crew')el.innerHTML=crewPanel(f);
  else if(S.tab==='ships')el.innerHTML=shipsPanel(f);
  else if(S.tab==='systems')el.innerHTML=systemsPanel(f);
  else el.innerHTML=journalPanel(f);
  wirePanel();
}

function crewPanel(f){
  let h='';
  for(const a of f.actors){
    const creating=a.lifepath_status!=='completed'||a.character_name==='Unnamed Traveller';
    const careers=(a.careers||[]).map(c=>`${esc(c.career_name)} (${c.terms_completed} terms, rank ${c.rank_number}, ${esc(c.stint_status)})`).join('; ');
    const skills=(a.skills||[]).map(s=>`${esc(s.name)}-${s.skill_level}`).join(', ');
    h+=`<div class="card">
      <div class="nm">${esc(a.character_name)} <span class="upp">${uppOf(a)}</span></div>
      <div class="sub">${esc(a.species?a.species.name:'Species unassigned')} · ${a.age_years?'Age '+a.age_years:'no age'} · Cr${cashOf(a)} · ${esc(a.lifepath_status||'lifepath not begun')}</div>
      <div class="sub">${esc(a.injury?a.injury.injury_status.replace(/_/g,' '):'')}${skills?' · '+skills:''}</div>
      ${careers?`<div class="sub">${careers}</div>`:''}
      ${a.lifepath_status!=='completed'?`<button class="goldbtn" data-cg="${a.public_id}">Continue creation</button>`:
        (a.character_name==='Unnamed Traveller'?`<button class="goldbtn" data-cg="${a.public_id}">Name character</button>`:'')}
    </div>`;
  }
  if(!f.actors.length)h+='<div class="card"><div class="sub">No characters yet.</div></div>';
  h+=`<button id="newChar" style="width:100%">+ New character (roll characteristics)</button>`;
  return h;
}

function shipsPanel(f){
  let h='';
  for(const s of f.ships){
    const fuel=(s.resources||[]).filter(r=>/fuel/.test(r.code)).map(r=>`${r.code}: ${r.current}/${r.capacity}`).join(' · ');
    h+=`<div class="card">
      <div class="nm">${esc(s.name)}</div>
      <div class="sub">${esc(s.class_code)} · ${s.hull_tons}t · J-${s.jump_rating} · cargo ${s.cargo_capacity_tons}t</div>
      <div class="sub">${esc(s.location_name||'Unplaced')}${s.owner_name?' · owner '+esc(s.owner_name):''}</div>
      ${fuel?`<div class="sub">${esc(fuel)}</div>`:''}
      <form class="rowform" data-place="${s.public_id}">
        <select name="system_public_id">${f.systems.map(y=>`<option value="${y.public_id}">${esc(y.name)}</option>`).join('')}</select>
        <button type="submit">Place</button>
      </form>
      <form class="rowform" data-refuel="${s.public_id}">
        <select name="actor_public_id">${actorOpts(f)}</select>
        <select name="fuel_type_code"><option value="refined">Refined</option><option value="unrefined">Unrefined</option></select>
        <input name="tons" size="4" value="1" title="tons">
        <button type="submit">Refuel</button>
      </form>
    </div>`;
  }
  if(!f.ships.length)h+='<div class="card"><div class="sub">No ships.</div></div>';
  h+=`<button id="acqShip" style="width:100%">+ Acquire ship</button>`;
  return h;
}

function systemsPanel(f){
  let h='';
  for(const y of f.systems){
    const uwp=[y.starport_code,y.size_code,y.atmosphere_code,y.hydrographics_code,y.population_code,y.government_code,y.law_level_code].map(v=>v??'?').join('')+(y.technology_level!=null?'-'+y.technology_level:'');
    h+=`<div class="card"><div class="nm">${esc(y.name)}</div>
      <div class="sub">Hex ${String(y.hex_column).padStart(2,'0')}${String(y.hex_row).padStart(2,'0')} · ${esc(y.sector_name)} · <span class="upp">${esc(uwp)}</span></div></div>`;
  }
  if(!f.systems.length)h+='<div class="card"><div class="sub">No star systems. Import a sector.</div></div>';
  h+=`<button id="impSector" style="width:100%">+ Import sector (.tab file)</button>`;
  return h;
}

function journalPanel(f){
  let h='';
  for(const n of f.journal_notes||[]){
    h+=`<div class="card"><div class="nm">${esc(n.title||'Untitled')}</div>
      <div class="sub">${esc((n.note_kind||'').toUpperCase())}</div>
      <div class="sub">${esc(n.note_text||n.body||'')}</div></div>`;
  }
  if(!(f.journal_notes||[]).length)h+='<div class="card"><div class="sub">No journal notes.</div></div>';
  h+=`<form id="noteForm" class="card">
    <label>Title <input name="title" required style="width:100%"></label>
    <label>Kind <select name="note_kind"><option>player</option><option>plot</option><option>world</option><option>referee</option><option>rules</option><option>other</option></select></label>
    <label>Note <textarea name="note_text" required style="width:100%;min-height:60px"></textarea></label>
    <button type="submit" style="margin-top:6px">Add note</button>
  </form>`;
  return h;
}

function actorOpts(f){return f.actors.map(a=>`<option value="${a.public_id}">${esc(a.character_name)}</option>`).join('');}

function wirePanel(){
  const f=S.full;if(!f)return;
  const nc=$('#newChar');
  if(nc)nc.onclick=async()=>{
    const ok=await post('/campaigns/'+S.cid+'/characters',{},'Characteristics rolled for a new Traveller.');
    if(ok){const un=S.full.actors.filter(a=>a.lifepath_status!=='completed');if(un.length)openChargen(un[un.length-1].public_id);}
  };
  document.querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>openChargen(b.dataset.cg));
  document.querySelectorAll('[data-place]').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();
    post('/campaigns/'+S.cid+'/ships/'+fm.dataset.place+'/placement',{system_public_id:fm.system_public_id.value},'Ship placed.');});
  document.querySelectorAll('[data-refuel]').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();
    post('/campaigns/'+S.cid+'/ships/'+fm.dataset.refuel+'/refuel',{actor_public_id:fm.actor_public_id.value,fuel_type_code:fm.fuel_type_code.value,tons:fm.tons.value},'Refueling complete.');});
  const acq=$('#acqShip');
  if(acq)acq.onclick=()=>{
    openGen(`<h3>Acquire ship</h3>
      <label>Owner <select id="asOwner">${actorOpts(f)}</select></label>
      <label>Class <select id="asClass">${S.shipClasses.map(c=>`<option value="${c.class_code}">${esc(c.class_code)} · ${c.hull_tons}t · J-${c.jump_rating}</option>`).join('')}</select></label>
      <label>Name <input id="asName"></label>
      <label>Registration (optional) <input id="asReg"></label>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button onclick="closeGen()">Cancel</button><button id="asGo">Acquire</button></div>`);
    $('#asGo').onclick=async()=>{
      const ok=await post('/campaigns/'+S.cid+'/ships',{owner_actor_public_id:$('#asOwner').value,class_code:$('#asClass').value,name:$('#asName').value,registration_identifier:$('#asReg').value},'Ship acquired.');
      if(ok)closeGen();
    };
  };
  const imp=$('#impSector');
  if(imp)imp.onclick=()=>{
    openGen(`<h3>Import sector</h3>
      <label>Sector name <input id="isName"></label>
      <label>Sector X <input id="isX" value="0" size="4"></label>
      <label>Sector Y <input id="isY" value="0" size="4"></label>
      <label>Sector file (.tab) <input id="isFile" type="file"></label>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button onclick="closeGen()">Cancel</button><button id="isGo">Import</button></div>`);
    $('#isGo').onclick=async()=>{
      const file=$('#isFile').files[0];if(!file||!$('#isName').value.trim())return;
      const fd=new FormData();
      fd.append('sector_name',$('#isName').value.trim());
      fd.append('sector_x',$('#isX').value||'0');fd.append('sector_y',$('#isY').value||'0');
      fd.append('source',file);
      const ok=await postMultipart('/campaigns/'+S.cid+'/sectors',fd,'Sector imported.');
      if(ok)closeGen();
    };
  };
  const nf=$('#noteForm');
  if(nf)nf.onsubmit=e=>{e.preventDefault();
    post('/campaigns/'+S.cid+'/notes',{title:nf.title.value,note_kind:nf.note_kind.value,note_text:nf.note_text.value},'Journal note added.').then(ok=>{if(ok){nf.reset();}});};
}

/* ---------- operations board ---------- */
function renderBoard(){
  const el=$('#board'),f=S.full;
  if(!f){el.innerHTML='<h2>Operations</h2><div class="card"><div class="sub">Create or select a campaign to begin.</div></div>';return;}
  let h=`<h2>Operations board — ${esc(f.name)}</h2>
    <div class="card"><div class="nm">Campaign day ${f.day_number}</div>
      <div class="sub">${esc(f.play_mode)} · ${esc(f.status)} · ${f.actors.length} crew · ${f.ships.length} ship(s) · ${f.systems.length} system(s)</div></div>`;
  h+='<h2>Journeys</h2>';
  for(const j of f.journeys){
    h+=`<div class="card"><div class="nm">${esc(j.name)} <span class="pill">${esc(j.journey_status)}</span></div>
      <div class="sub">${esc(j.ship_name)} · ${esc(j.origin_name||'?')} → ${esc(j.destination_name||'?')} · ${j.distance_parsecs??'?'} pc
        ${j.route_succeeded!=null?' · route '+(j.route_succeeded?'plotted':'failed'):''}
        ${j.jump_outcome?' · jump '+esc(j.jump_outcome):''}
        ${j.execution_status?' · '+esc(j.execution_status):''}</div>
      <div class="rowform" data-journey="${j.public_id}">
        <select class="jActor">${actorOpts(f)}</select>
        <button data-act="navigation">Plot route</button>
        <button data-act="attempt">Resolve jump</button>
        <button data-act="depart">Depart</button>
        <button data-act="arrive">Arrive</button>
      </div></div>`;
  }
  if(!f.journeys.length)h+='<div class="card"><div class="sub">No journeys planned.</div></div>';
  h+=`<h2>Plan a jump</h2>
    <div class="card"><form id="jumpForm" class="rowform">
      <select name="ship_public_id">${f.ships.map(s=>`<option value="${s.public_id}">${esc(s.name)}</option>`).join('')}</select>
      <select name="destination_system_public_id">${f.systems.map(y=>`<option value="${y.public_id}">${esc(y.name)}</option>`).join('')}</select>
      <input name="journey_name" placeholder="Journey name" required>
      <button type="submit">◈ Plan jump</button>
    </form></div>`;
  el.innerHTML=h;
  document.querySelectorAll('[data-journey]').forEach(row=>{
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const jid=row.dataset.journey,act=b.dataset.act,actor=row.querySelector('.jActor').value;
      if(act==='navigation')post(`/campaigns/${S.cid}/journeys/${jid}/navigation`,{actor_public_id:actor},'Jump route plotted.');
      else if(act==='attempt')post(`/campaigns/${S.cid}/journeys/${jid}/attempt`,{actor_public_id:actor},'Jump attempt resolved.');
      else post(`/campaigns/${S.cid}/journeys/${jid}/${act}`,{},act==='depart'?'Ship departed.':'Ship arrived.');
    });
  });
  const jf=$('#jumpForm');
  if(jf)jf.onsubmit=e=>{e.preventDefault();
    post('/campaigns/'+S.cid+'/jumps',{ship_public_id:jf.ship_public_id.value,destination_system_public_id:jf.destination_system_public_id.value,journey_name:jf.journey_name.value},'Jump planned: '+jf.journey_name.value);};
}

/* ---------- chargen wizard ---------- */
function openChargen(actorId){S.cgActor=actorId;S.cgLog=[];renderChargen();$('#cgModal').style.display='flex';}
function closeChargen(){S.cgActor=null;$('#cgModal').style.display='none';}
window.closeChargen=closeChargen;

function cgPost(path,fields,okMsg){return post(path,fields,okMsg);}
window.cgPost=cgPost;

function renderChargen(){
  const f=S.full,a=f&&f.actors.find(x=>x.public_id===S.cgActor);
  if(!a){closeChargen();return;}
  const base=`/campaigns/${S.cid}/characters/${a.public_id}`;
  let step=chargenStep(a,base,f);
  const chars=(a.characteristics||[]).map(c=>`${c.abbreviation} ${c.current}`).join(' · ');
  $('#cgBody').innerHTML=`
    <h3>Create a Traveller <span class="pill">${esc(a.lifepath_status||'in progress')}</span></h3>
    <div class="sub" style="color:var(--dim)">${esc(a.character_name)} · <span class="upp">${uppOf(a)}</span> · ${chars}${a.age_years?' · age '+a.age_years:''}</div>
    <div class="cgfeed">${S.cgLog.map(x=>`<div>${esc(x)}</div>`).join('')||'<div>Every roll is audited by the rules engine.</div>'}</div>
    ${!a.species?speciesStep(a,base,f):''}
    ${step}
    <div style="margin-top:12px;display:flex;justify-content:flex-end"><button onclick="closeChargen()">Save and return later</button></div>`;
  wireChargen();
}

function speciesStep(a,base,f){
  return `<div class="cgstep"><small>SPECIES</small><b>Choose a species (optional)</b>
    <div class="rowform"><select id="cgSpecies">${(f.species_options||[]).map(s=>`<option value="${s.species_code}">${esc(s.name)}</option>`).join('')}</select>
    <button data-cga="species">Assign species</button></div></div>`;
}

function chargenStep(a,base,f){
  const cid=S.cid;
  /* career entry fallback */
  if(a.career_entry_pending){
    const p=a.career_entry_pending;
    return `<div class="cgstep"><small>CAREER ENTRY FAILED</small>
      <b>${esc(p.career_name)} qualification failed</b>
      <p>Result ${p.check_total} vs target ${p.target_number}. Choose a fallback.</p>
      <div class="cgbtns">
        ${p.draft_available?'<button data-cga="fallback" data-arg="draft">Submit to the draft</button>':'<span class="sub">The one permitted draft has already been used. Drifter is the remaining fallback.</span>'}
        <button data-cga="fallback" data-arg="drifter">Enter the Drifter career</button>
      </div></div>`;
  }
  /* aging */
  if(a.career_aging){
    const g=a.career_aging;
    if(g.stage==='roll')return `<div class="cgstep"><small>AGING</small><b>${g.aging_kind==='anagathic_stopping_shock'?'Anagathic stopping shock':'Aging check required'}</b>
      <p>Roll the aging table before career progression continues.</p>
      <button data-cga="aging-roll" data-arg="${esc(g.aging_kind)}">Roll aging check</button></div>`;
    if(g.stage==='allocation'){
      const mental=[['characteristic.intelligence','Intelligence'],['characteristic.education','Education'],['characteristic.social-standing','Social Standing']];
      let h=`<div class="cgstep"><small>AGING</small><b>${esc((g.aging_effect_code||'').replace(/_/g,' '))}</b>
        <p>2d6 ${g.natural_total} ${g.term_modifier>=0?'+':''}${g.term_modifier} → ${g.table_result}. ${esc(g.source_effect_text||'')}</p>`;
      (g.allocation_options||[]).forEach((o,i)=>{
        h+=`<div class="rowform">${g.mental_reduction_amount?`<select class="agMental" data-i="${i}">${mental.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select>`:''}
          <button data-cga="aging-apply" data-arg="${i}" data-codes="${o.physical_codes.join(',')}">${esc(o.summary)}</button></div>`;
      });
      return h+'</div>';
    }
    if(g.stage==='crisis_cost')return `<div class="cgstep"><small>AGING CRISIS</small><b>Aging medical crisis</b>
      <p>A characteristic reached zero. Determine the emergency treatment price.</p>
      <button data-cga="aging-crisis-cost">Determine treatment cost</button></div>`;
    return `<div class="cgstep"><small>AGING CRISIS</small><b>Aging treatment: Cr${g.medical_cost_credits}</b>
      <p>Available cash Cr${g.cash_credits}. Paying restores zero characteristics to 1 but bars further qualification.</p>
      <div class="cgbtns">${g.cash_credits>=g.medical_cost_credits?'<button data-cga="aging-crisis" data-arg="pay">Pay and survive</button>':''}
      <button data-cga="aging-crisis" data-arg="accept_death">Accept character death</button></div></div>`;
  }
  /* basic training */
  if(a.basic_training){
    const bt=a.basic_training;
    if(bt.first_career){
      let h=`<div class="cgstep"><small>BASIC TRAINING</small><b>${esc(bt.career_name)} basic training</b>
        <p>Your first career grants every Service-table skill at level 0. Choose required specialties.</p>`;
      (bt.entries||[]).forEach((e,i)=>{
        if(e.cascade_skill)h+=`<label>${e.roll_value} · ${esc(e.skill_name)} specialty
          <select class="btSpec">${(e.specializations||[]).map(s=>`<option value="${esc(e.skill_rule_code)}||${s.rule_code}">${esc(s.name)}</option>`).join('')}</select></label>`;
        else h+=`<div class="sub" style="color:var(--dim)">${e.roll_value} · ${esc(e.source_outcome_text)}</div>`;
      });
      return h+'<div style="margin-top:8px"><button data-cga="basic-first">Apply all Service skills</button></div></div>';
    }
    let h=`<div class="cgstep"><small>BASIC TRAINING</small><b>${esc(bt.career_name)}: choose one Service result</b>`;
    (bt.entries||[]).forEach(e=>{
      h+=`<div class="rowform"><span class="sub" style="color:var(--dim)">${e.roll_value} · ${esc(e.source_outcome_text)}</span>
        ${e.cascade_skill?`<select class="btSel" data-roll="${e.roll_value}">${(e.specializations||[]).map(s=>`<option value="${esc(e.skill_rule_code)}||${s.rule_code}">${esc(s.name)}</option>`).join('')}</select>`:''}
        <button data-cga="basic-one" data-arg="${e.roll_value}">Choose</button></div>`;
    });
    return h+'</div>';
  }
  /* rank zero award */
  if(a.rank_zero_award){
    const r0=a.rank_zero_award;
    return `<div class="cgstep"><small>RANK 0</small><b>Enter at Rank 0${r0.title?': '+esc(r0.title):''}</b>
      <p>${esc(r0.source_grant_text||'')}</p>
      ${r0.cascade_skill?`<label>${esc(r0.skill_name)} specialty <select id="r0Spec">${(r0.specializations||[]).map(s=>`<option value="${s.rule_code}">${esc(s.name)}</option>`).join('')}</select></label>`:''}
      <button data-cga="rank-zero">Apply Rank 0 award</button></div>`;
  }
  /* term step */
  if(a.career_term_step){
    const t=a.career_term_step;
    if(t.stage==='anagathics_choice')return `<div class="cgstep"><small>TERM ${t.term_number}</small><b>${esc(t.career_name)}: declare anagathics</b>
      <p>Use adds a random Cr2,500–15,000 debt and a second survival check.</p>
      <div class="cgbtns"><button data-cga="anagathics" data-arg="false">Proceed without anagathics</button>
      <button data-cga="anagathics" data-arg="true">Use anagathics</button></div></div>`;
    if(t.stage==='survival_ready')return `<div class="cgstep"><small>TERM ${t.term_number}</small><b>Survival check</b>
      <p>${t.uses_anagathics?'Anagathics active · Cr'+t.cost_credits+' debt · two checks':'No anagathics · one survival check'}</p>
      <button data-cga="survival">Roll survival</button></div>`;
    if(t.stage==='survival_result'){
      let h=`<div class="cgstep"><small>TERM ${t.term_number}</small><b>Survival ${t.survived?'passed':'failed'}</b>
        <p>${esc(t.characteristic_name||'')} ${t.survival_characteristic_value} · total ${t.survival_check_total} vs ${t.survival_target}</p>`;
      if(!t.survived)h+='<button data-cga="mishap">Roll career mishap</button>';
      else h+='<p class="sub" style="color:var(--dim)">Rank resolution is next; it will appear automatically.</p>';
      return h+'</div>';
    }
    if(t.stage==='rank_decision'){
      const r=t.rank_attempt,label=r.attempt_kind==='commission'?'Commission':'Promotion';
      return `<div class="cgstep"><small>RANK</small><b>${label} decision</b>
        <p>Target ${r.target_number}. Success reaches Rank ${r.resulting_rank}${r.award&&r.award.title?', '+esc(r.award.title):''} and adds a training roll.</p>
        ${r.award&&r.award.cascade_skill?`<label>${esc(r.award.skill_name)} specialty on success <select id="rkSpec">${(r.award.specializations||[]).map(s=>`<option value="${s.rule_code}">${esc(s.name)}</option>`).join('')}</select></label>`:''}
        <div class="cgbtns"><button data-cga="rank" data-arg="attempt" data-kind="${r.attempt_kind}">Attempt ${label.toLowerCase()}</button>
        <button data-cga="rank" data-arg="decline" data-kind="${r.attempt_kind}">Decline</button></div></div>`;
    }
    if(t.stage==='term_training_pending'){
      let h=`<div class="cgstep"><small>TRAINING</small><b>Term training · ${t.training_rolls_completed}/${t.allowed_training_rolls} rolls used</b>`;
      for(const r of t.training_results||[])h+=`<p class="sub" style="color:var(--dim)">Training ${r.training_roll_order}: ${esc(r.training_table_code)} ${r.roll_value} · ${esc(r.result_name)} → ${r.resulting_value}</p>`;
      for(const tb of t.training_tables||[]){
        h+=`<div class="rowform" data-table="${esc(tb.code)}"><span>${esc(tb.name)}</span>`;
        for(const c of tb.cascades||[])h+=`<select class="ttSpec">${(c.specializations||[]).map(s=>`<option value="${esc(c.rule_code)}||${s.rule_code}">${esc(s.name)}</option>`).join('')}</select>`;
        h+=`<button data-cga="term-train" data-arg="${esc(tb.code)}">Roll ${esc(tb.name)}</button></div>`;
      }
      return h+'</div>';
    }
    if(t.stage==='term_completion_pending'){
      let h=`<div class="cgstep"><small>TERM</small><b>Term training complete</b>`;
      for(const r of t.training_results||[])h+=`<p class="sub" style="color:var(--dim)">Training ${r.training_roll_order}: ${esc(r.training_table_code)} ${r.roll_value} · ${esc(r.result_name)} → ${r.resulting_value}</p>`;
      return h+'<button data-cga="term-complete">Complete four-year term</button></div>';
    }
    if(t.stage==='reenlistment_roll')return `<div class="cgstep"><small>REENLISTMENT</small><b>Term ${t.completed_term_number} complete</b>
      <p>Age ${a.age_years}. Roll the reenlistment check.</p><button data-cga="reenlist">Roll reenlistment</button></div>`;
    if(t.stage==='reenlistment_choice')return `<div class="cgstep"><small>REENLISTMENT</small><b>Reenlistment available</b>
      <p>Natural ${t.natural_total} vs ${t.target_number}. Continue this career or muster out.</p>
      <div class="cgbtns"><button data-cga="reenlist-decide" data-arg="continue">Continue career</button>
      <button data-cga="reenlist-decide" data-arg="leave">Leave career</button></div></div>`;
  }
  /* departure + injury + crisis + medical + muster */
  let extra='';
  if(a.career_departure){
    const d=a.career_departure;
    extra+=`<div class="cgstep"><small>DEPARTURE</small><b>Career ended: ${esc((d.outcome_code||'').replace(/_/g,' '))}</b>
      <p>${esc(d.outcome_text||'')}</p><p class="sub" style="color:var(--dim)">${d.elapsed_years} elapsed years · Cr${d.debt_credits} debt</p></div>`;
  }
  if(a.career_injury&&!a.career_injury.determination_kind){
    const inj=a.career_injury;
    if(inj.injury_mode==='result_two_or_twice_lower')
      return extra+`<div class="cgstep"><small>INJURY</small><b>Determine career injury</b>
        <div class="cgbtns"><button data-cga="injury" data-arg="fixed_two">Take result 2</button>
        <button data-cga="injury" data-arg="roll_twice_lower">Roll twice, keep lower</button></div></div>`;
    return extra+`<div class="cgstep"><small>INJURY</small><b>Determine career injury</b>
      <button data-cga="injury" data-arg="">Roll injury result</button></div>`;
  }
  if(a.career_injury&&a.career_injury.consequence_status==='awaiting_application'){
    const inj=a.career_injury,phys=[['characteristic.strength','Strength'],['characteristic.dexterity','Dexterity'],['characteristic.endurance','Endurance']];
    let h=extra+`<div class="cgstep"><small>INJURY</small><b>${esc((inj.outcome_code||'').replace(/_/g,' '))}</b><p>${esc(inj.outcome_text||'')}</p>`;
    if(inj.reduction_kind==='one_physical_d6_and_others'){
      h+=`<div class="rowform"><select id="injSplit">${phys.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select>
        <button data-cga="injury-apply" data-arg="split">Apply 1d6 and split remaining</button></div>`;
    }else{
      const opts=phys.filter(p=>inj.reduction_kind!=='strength_or_dexterity_two'||p[0]!=='characteristic.endurance');
      h+=`<div class="rowform"><select id="injOne">${opts.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select>
        <button data-cga="injury-apply" data-arg="one">Apply injury loss</button></div>`;
    }
    return h+'</div>';
  }
  if(a.injury_crisis&&!a.injury_crisis.crisis_status)
    return extra+`<div class="cgstep"><small>CRISIS</small><b>Life-threatening injury crisis</b>
      <button data-cga="crisis-cost">Determine crisis care cost</button></div>`;
  if(a.injury_crisis&&a.injury_crisis.crisis_status==='awaiting_decision'){
    const c=a.injury_crisis;
    return extra+`<div class="cgstep"><small>CRISIS</small><b>Emergency care: Cr${c.medical_cost_credits}</b>
      <p>Available cash Cr${c.cash_credits}.</p>
      <div class="cgbtns">${c.cash_credits>=c.medical_cost_credits?'<button data-cga="crisis" data-arg="pay">Pay and survive</button>':''}
      <button data-cga="crisis" data-arg="accept_death">Accept character death</button></div></div>`;
  }
  if(a.medical_care){
    const m=a.medical_care;
    let h=extra+`<div class="cgstep"><small>MEDICAL CARE</small><b>Post-injury medical care</b>
      <p>Cr5,000 per restored point before ${esc(m.career_name)} coverage (Rank ${m.rank_number}).</p>`;
    for(const r of m.reductions||[])h+=`<label>${esc(r.name)} points (max ${r.restorable_points})
      <input type="number" class="medPts" data-code="${r.rule_code}" min="0" max="${r.restorable_points}" value="${r.restorable_points}"></label>`;
    return h+`<div class="cgbtns"><button data-cga="medical" data-arg="purchase">Purchase restoration</button>
      <button data-cga="medical" data-arg="decline">Decline medical care</button></div></div>`;
  }
  if(a.career_muster&&!a.career_injury&&!a.medical_care&&!a.injury_crisis){
    const m=a.career_muster;
    if(!m.muster_status)return extra+`<div class="cgstep"><small>MUSTER</small><b>Muster out of ${esc(m.career_name)}</b>
      <p>${m.departure_reason==='forced_leave_failed'?`Reenlistment failed ${m.reenlistment_total} vs ${m.reenlistment_target}; Cepheus requires this career to end. `:''}${m.terms_completed} terms · Rank ${m.rank_number}.</p>
      <button data-cga="muster">Calculate benefits and pension</button></div>`;
    let h=extra+`<div class="cgstep"><small>MUSTER</small><b>${esc(m.career_name)} mustering out · ${m.rolls_completed}/${m.total_benefit_rolls}</b>`;
    for(const r of m.benefit_rolls||[])h+=`<p class="sub" style="color:var(--dim)">Roll ${r.roll_order} · ${esc(r.benefit_table_code)} ${r.natural_roll} → ${r.table_result}: ${esc(r.source_outcome_text||'')}${r.cash_awarded?' · Cr'+r.cash_awarded:''}</p>`;
    if(m.muster_status==='rolling'){
      h+=`<div class="cgbtns"><button data-cga="benefit" data-arg="material">Roll Material benefit</button>
        ${m.cash_rolls_taken<3?'<button data-cga="benefit" data-arg="cash">Roll Cash benefit</button>':''}</div>`;
    }else if(m.muster_status==='awaiting_weapon_choice'){
      h+='<p>Choose any weapon, or improve an associated skill for a held weapon.</p>';
      for(const w of m.weapons||[]){
        h+=`<div class="rowform"><span>${esc(w.name)}${w.quantity?' (held '+w.quantity+')':''}</span>
          <button data-cga="weapon" data-arg="item" data-w="${esc(w.rule_code)}">Take weapon</button>
          ${(w.skills||[]).map(sk=>`<button data-cga="weapon" data-arg="skill" data-w="${esc(w.rule_code)}" data-sk="${esc(sk.rule_code)}">Improve ${esc(sk.name)}</button>`).join('')}</div>`;
      }
    }
    return h+'</div>';
  }
  if(extra)return extra;
  /* no active career: entry or finish */
  const active=(a.careers||[]).filter(c=>c.stint_status==='active');
  if(!active.length&&a.lifepath_status!=='completed'){
    let h='';
    if(!(a.careers||[]).length&&!S.kept[a.public_id]){
      h+=`<div class="cgstep"><small>STEP 1 · CHARACTERISTICS</small><b>Keep these rolls or try another set</b>
        <p>Total ${(a.characteristics||[]).reduce((s,c)=>s+c.current,0)}. Reroll all six as often as you like before entering a career.</p>
        <div class="cgbtns"><button data-cga="reroll">Reroll all six</button>
        <button data-cga="keep" class="goldbtn">Keep rolls and choose career</button></div></div>`;
      return h;
    }
    h+=`<div class="cgstep"><small>CAREER ENTRY</small><b>Attempt qualification</b>
      <div class="rowform"><select id="cgCareer">${(f.career_options||[]).map(o=>`<option value="${esc(o.career_code)}||${esc(o.assignment_code||'')}">${esc(o.career_name)}${o.assignment_name?' · '+esc(o.assignment_name):''}</option>`).join('')}</select>
      <button data-cga="career-entry">Attempt qualification</button></div>
      <div style="margin-top:8px"><button data-cga="finish">Finish prior experience and begin play</button></div></div>`;
    return h;
  }
  /* completed → final details */
  if(a.lifepath_status==='completed'){
    return `<div class="cgstep"><small>FINAL DETAILS</small><b>Name your Traveller</b>
      <label>Character name <input id="fdName" value="${a.character_name==='Unnamed Traveller'?'':esc(a.character_name)}" maxlength="120"></label>
      <label>Gender identity (optional) <input id="fdGender" value="${esc(a.gender_identity||'')}"></label>
      <label>Appearance (optional) <textarea id="fdApp" style="width:100%">${esc(a.appearance||'')}</textarea></label>
      <label>Personal goal 1 <input class="fdGoal" value="${esc((a.personal_goals||[])[0]||'')}"></label>
      <label>Personal goal 2 <input class="fdGoal" value="${esc((a.personal_goals||[])[1]||'')}"></label>
      <label>Personal goal 3 <input class="fdGoal" value="${esc((a.personal_goals||[])[2]||'')}"></label>
      <div style="margin-top:8px"><button data-cga="final-details" class="goldbtn">Save details</button></div></div>`;
  }
  return '<div class="cgstep"><b>Waiting on engine state…</b><p class="sub" style="color:var(--dim)">No pending chargen decision was found for this actor.</p></div>';
}

function wireChargen(){
  const f=S.full,a=f.actors.find(x=>x.public_id===S.cgActor);if(!a)return;
  const base=`/campaigns/${S.cid}/characters/${a.public_id}`;
  document.querySelectorAll('#cgBody [data-cga]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.cga,arg=b.dataset.arg;
    switch(act){
      case 'species':return cgPost(base+'/species',{species_code:$('#cgSpecies').value},'Species assigned.');
      case 'reroll':return cgPost(base+'/reroll-characteristics',{},'Characteristics rerolled.');
      case 'keep':S.kept[a.public_id]=true;renderChargen();return;
      case 'career-entry':{const[cc,ac]=$('#cgCareer').value.split('||');
        return cgPost(base+'/career-entry',{career_selection:cc+'||'+(ac||'')},'Career qualification attempted: '+cc);}
      case 'fallback':return cgPost(`/campaigns/${S.cid}/career-entry-fallbacks`,{attempt_command_public_id:a.career_entry_pending.command_public_id,fallback_kind:arg},'Fallback: '+arg);
      case 'basic-first':{
        const spec=[...document.querySelectorAll('.btSpec')].map(s=>s.value);
        return cgPost(base+'/basic-training',{specialization:spec},'Basic training applied (all Service skills).');}
      case 'basic-one':{
        const sel=document.querySelector(`.btSel[data-roll="${arg}"]`);
        const fields={selected_roll_value:arg};if(sel)fields.specialization=[sel.value];
        return cgPost(base+'/basic-training',fields,'Basic training result '+arg+' chosen.');}
      case 'rank-zero':{const fields={};const s=$('#r0Spec');if(s)fields.cascade_specialization=s.value;
        return cgPost(base+'/rank-zero-award',fields,'Rank 0 award applied.');}
      case 'anagathics':return cgPost(base+'/anagathics',{uses_anagathics:arg},'Anagathics declared: '+arg);
      case 'survival':return cgPost(base+'/career-survival',{},'Survival rolled.');
      case 'mishap':return cgPost(base+'/survival-mishap',{},'Mishap resolved.');
      case 'rank':{const fields={attempt_kind:b.dataset.kind,decision:arg};const s=$('#rkSpec');if(s&&arg==='attempt')fields.cascade_specialization=s.value;
        return cgPost(base+'/career-rank-attempt',fields,(arg==='attempt'?'Attempted ':'Declined ')+b.dataset.kind+'.');}
      case 'term-train':{
        const row=b.closest('[data-table]');
        const spec=[...row.querySelectorAll('.ttSpec')].map(s=>s.value);
        return cgPost(base+'/career-term-training',{training_table_code:arg,specialization:spec},'Training rolled on '+arg+'.');}
      case 'term-complete':return cgPost(base+'/career-term-completion',{},'Four-year term completed.');
      case 'reenlist':return cgPost(base+'/career-reenlistment',{},'Reenlistment rolled.');
      case 'reenlist-decide':return cgPost(base+'/career-reenlistment-decision',{decision:arg},'Reenlistment decision: '+arg+'.');
      case 'aging-roll':return cgPost(base+'/career-aging',{aging_kind:arg||'term'},'Aging check rolled.');
      case 'aging-apply':{
        const codes=b.dataset.codes?b.dataset.codes.split(','):[];
        const fields={physical_characteristic_codes:codes};
        const m=document.querySelector(`.agMental[data-i="${arg}"]`);if(m)fields.mental_characteristic_code=m.value;
        return cgPost(base+'/career-aging-application',fields,'Aging losses applied.');}
      case 'aging-crisis-cost':return cgPost(base+'/aging-crisis-cost',{},'Aging crisis cost determined.');
      case 'aging-crisis':return cgPost(base+'/aging-crisis-resolution',{resolution_kind:arg},'Aging crisis: '+arg+'.');
      case 'injury':{const fields={};if(arg)fields.result_two_choice=arg;
        return cgPost(base+'/career-injury',fields,'Injury determined.');}
      case 'injury-apply':{
        let fields;
        if(arg==='split')fields={primary_characteristic_code:$('#injSplit').value,other_reduction_mode:'split_two_each'};
        else fields={primary_characteristic_code:$('#injOne').value};
        return cgPost(base+'/career-injury-application',fields,'Injury applied.');}
      case 'crisis-cost':return cgPost(base+'/injury-crisis-cost',{},'Crisis care cost determined.');
      case 'crisis':return cgPost(base+'/injury-crisis-resolution',{resolution_kind:arg},'Injury crisis: '+arg+'.');
      case 'medical':{
        const fields={decision:arg};
        if(arg==='purchase')for(const inp of document.querySelectorAll('.medPts')){
          const code=inp.dataset.code;
          if(code==='characteristic.strength')fields.strength_points=inp.value;
          else if(code==='characteristic.dexterity')fields.dexterity_points=inp.value;
          else fields.endurance_points=inp.value;}
        return cgPost(base+'/career-medical-care',fields,'Medical care: '+arg+'.');}
      case 'muster':return cgPost(base+'/career-muster',{},'Muster benefits calculated.');
      case 'benefit':return cgPost(base+'/career-benefit',{benefit_table_code:arg},'Benefit rolled ('+arg+').');
      case 'weapon':{const fields={weapon_rule_code:b.dataset.w,resolution_kind:arg};if(arg==='skill')fields.skill_rule_code=b.dataset.sk;
        return cgPost(base+'/career-weapon-benefit',fields,'Weapon benefit resolved.');}
      case 'finish':return cgPost(base+'/finish-creation',{},'Prior experience finished — beginning play.');
      case 'final-details':{
        const goals=[...document.querySelectorAll('.fdGoal')].map(g=>g.value).filter(v=>v.trim());
        const name=$('#fdName').value.trim();if(!name)return;
        return cgPost(base+'/final-details',{character_name:name,gender_identity:$('#fdGender').value,appearance:$('#fdApp').value,personal_goals:goals},'Final details saved for '+name+'.')
          .then(ok=>{if(ok)closeChargen();});}
    }
  });
}

/* ---------- referee feed input ---------- */
async function sendAction(){
  const inp=$('#actionIn'),text=inp.value.trim();if(!text||!S.cid)return;
  inp.value='';
  const external=S.full&&['ai_refereed','player_directed'].includes(S.full.play_mode);
  const offline=external&&S.full.mcp_referee&&S.full.mcp_referee.status==='offline';
  await post('/campaigns/'+S.cid+'/referee-turns',{player_text:text},external?(offline?'Action queued. MCP referee is offline; open or reconnect your desktop client.':'Action queued for the connected MCP referee.'):'Narration published.');
}
$('#sendBtn').onclick=sendAction;
$('#actionIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendAction();});
$('#genModal').addEventListener('click',e=>{if(e.target.id==='genModal')closeGen();});
$('#cgModal').addEventListener('click',e=>{if(e.target.id==='cgModal')closeChargen();});

/* ---------- boot ---------- */
(async function(){
  try{
    await loadCampaigns();
    try{S.shipClasses=await api('/api/catalog/ship-classes');}catch(e){}
    await refresh();
    setInterval(async()=>{if(!S.cid)return;try{const p=await api('/api/campaigns/'+S.cid+'/pulse');if(S.full){S.full.mcp_referee=p.mcp_referee;paintMcp(p.mcp_referee);}}catch(e){}},4000);
  }catch(e){/* redirected to login */}
})();
</script>
