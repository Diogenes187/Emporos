app = "emporos-next"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  EMPOROS_UPLOAD_ROOT = "/data/uploads"
  PORT = "8080"

[deploy]
  release_command = "python tools/deploy_database.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "emporos_uploads"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
